# Render Blueprint for RefluxCare.
#
# One web service (the API, which also serves the website) plus a free
# PostgreSQL database. In Render: New +  ->  Blueprint  ->  connect this repo,
# and Render reads this file. It will ask you to set APP_PASSCODE (your secret
# unlock code) during setup.
#
# Note: Render's free PostgreSQL expires ~90 days after creation. Before then,
# export your data (or upgrade the database) so nothing is lost.

databases:
  - name: refluxcare-db
    plan: free
    databaseName: refluxcare
    user: refluxcare

services:
  - type: web
    name: refluxcare
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: refluxcare-db
          property: connectionString
      # Your private unlock code. Render prompts for this on first deploy.
      # Choose something only you know.
      - key: APP_PASSCODE
        sync: false
