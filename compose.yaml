services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-refluxcare}
      POSTGRES_USER: ${POSTGRES_USER:-refluxcare}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-refluxcare-local}
    ports:
      - "5432:5432"
    volumes:
      - refluxcare_postgres:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${POSTGRES_USER:-refluxcare} -d ${POSTGRES_DB:-refluxcare}
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./server
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://refluxcare:refluxcare-local@db:5432/refluxcare}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
    ports:
      - "8000:8000"
    volumes:
      - ./server:/app
    depends_on:
      db:
        condition: service_healthy

volumes:
  refluxcare_postgres:

